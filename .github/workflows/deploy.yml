name: Deploy Nexus Bet

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/pierrekrob/symfony_paris_sportif

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy via docker-compose
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DATABASE_URL: mysql://root:${{ secrets.MYSQL_ROOT_PASSWORD }}@db:3306/nexus_bet?serverVersion=8.0&charset=utf8mb4
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          LOL_ESPORTS_API_KEY: ${{ secrets.LOL_ESPORTS_API_KEY }}
        run: |
          mkdir -p "$HOME/nexus-bet"
          cp docker-compose.prod.yml "$HOME/nexus-bet/docker-compose.prod.yml"

          cd "$HOME/nexus-bet"

          export APP_SECRET="$APP_SECRET"
          export MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD"
          export DATABASE_URL="$DATABASE_URL"
          export RIOT_API_KEY="$RIOT_API_KEY"
          export LOL_ESPORTS_API_KEY="$LOL_ESPORTS_API_KEY"

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --force-recreate

      - name: Health check
        run: |
          sleep 5
          curl -sf http://127.0.0.1:3005 > /dev/null && echo "✓ App up" || echo "⚠ Health check failed"
